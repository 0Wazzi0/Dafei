<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>裁床单大师 - 打菲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 SheetJS 用于导出 Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
      @media print {
        @page {
          size: 40mm 80mm;
          margin: 0 !important;
          padding: 0 !important;
          /* 去除浏览器默认页眉页脚 */
          margin-top: 0 !important;
          margin-bottom: 0 !important;
          margin-left: 0 !important;
          margin-right: 0 !important;
        }
        html, body {
          margin: 0 !important;
          padding: 0 !important;
          height: auto !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        body {
          background: white;
        }
        .print-preview-shell > :not(.thermal-print-root) {
          display: none !important;
        }
        body * {
          visibility: hidden !important;
        }
        .thermal-print-root,
        .thermal-print-root * {
          visibility: visible !important;
        }
        .print-preview-shell {
          position: static !important;
          inset: auto !important;
          width: auto !important;
          height: auto !important;
          min-height: 0 !important;
          overflow: visible !important;
          padding: 0 !important;
          margin: 0 !important;
          background: transparent !important;
        }
        .thermal-print-root {
          display: block !important;
          position: static !important;
          width: var(--paper-width, 40mm) !important;
          min-height: var(--paper-height, 80mm) !important;
          margin: 0 !important;
          padding: 0 !important;
        }
        .no-print {
          display: none !important;
        }
        .print-label {
          width: var(--paper-width, 40mm);
          height: var(--paper-height, 80mm);
          padding: calc(var(--print-padding, 8px) / 3);
          box-sizing: border-box;
          page-break-after: always;
          break-after: page;
          page-break-inside: avoid;
          break-inside: avoid-page;
          display: flex;
          flex-direction: column;
          font-family: sans-serif;
          color: black;
          overflow: hidden;
          gap: calc(var(--print-gap, 10px) / 3);
        }
        .print-label:last-child {
          page-break-after: auto;
          break-after: auto;
        }
        .label-content {
          height: 100%;
          padding: var(--print-padding, 8px) var(--print-padding, 8px) calc(var(--print-padding, 8px) + 10px);
          display: flex;
          flex-direction: column;
          font-size: var(--print-font-size, 18px);  /* 增大字体 */
          line-height: calc(var(--print-line-spacing, 1.2) * 1em);
          box-sizing: border-box;
        }
        
        /* 移除浏览器默认页眉页脚 */
        @page :first {
          margin: 0 !important;
          padding-top: 0 !important;
        }
        @page :left {
          margin: 0 !important;
        }
        @page :right {
          margin: 0 !important;
        }
        
        /* 隐藏所有非打印元素 */
        header, footer, nav, aside, .no-print {
          display: none !important;
        }
        
        /* 隐藏标题栏和可能的页眉元素 */
        h1, h2, h3, h4, h5, h6 {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
      }

      /* Preview styling for labels */
      .label-preview-container {
        display: flex;
        flex-wrap: wrap;
        gap: calc(var(--print-gap, 10px) * 2);
        justify-content: center;
        padding: 40px;
        background: #e2e8f0;
      }
      .label-preview-card {
        width: var(--paper-width, 40mm);
        height: var(--paper-height, 80mm);
        background: white;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        padding: calc(var(--print-padding, 8px) / 1.5);
        box-sizing: border-box;
        font-family: sans-serif;
        transition: all 0.2s ease;
      }
      .label-inner {
        height: 100%;
        padding: var(--print-padding, 8px) var(--print-padding, 8px) calc(var(--print-padding, 8px) + 10px);
        display: flex;
        flex-direction: column;
        font-size: var(--print-font-size, 18px);  /* 增大预览字体 */
        line-height: calc(var(--print-line-spacing, 1.3) * 1em);
        box-sizing: border-box;
      }
      .label-header {
        text-align: center;
        font-weight: bold;
        border-bottom: 1px solid black;
        margin-bottom: 1mm;
        padding-bottom: 0.5mm;
        font-size: 14px;
      }
      .label-row {
        display: flex;
        margin-bottom: 0.5mm;
      }
      .label-row b {
        min-width: 12mm;
      }
      .label-footer {
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        font-size: 12px;  /* 增大页码字体 */
        border-top: 1px dashed black;
        padding-top: 1mm;
      }

      .fade-enter-active, .fade-leave-active {
        transition: opacity 0.2s ease;
      }
      .fade-enter-from, .fade-leave-to {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
