<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>裁床单大师 - 打菲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 SheetJS 用于导出 Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
      .print-label {
        width: var(--paper-width, 40mm);
        height: var(--paper-height, 80mm);
        padding: 0;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        font-family: sans-serif;
        color: black;
        overflow: hidden;
        gap: calc(var(--print-gap, 10px) / 3);
      }

      .label-content {
        width: var(--print-area-width, 28mm);
        height: var(--print-area-height, 60mm);
        margin: var(--print-area-top, 10mm) auto 0;
        padding: var(--print-padding, 8px) var(--print-padding, 8px) calc(var(--print-padding, 8px) + 10px);
        display: flex;
        flex-direction: column;
        font-size: var(--print-font-size, 18px);
        line-height: calc(var(--print-line-spacing, 1.2) * 1em);
        box-sizing: border-box;
      }

      @media print {
        @page {
          size: 40mm 80mm;
          margin: 0 !important;
          padding: 0 !important;
          /* 去除浏览器默认页眉页脚 */
          margin-top: 0 !important;
          margin-bottom: 0 !important;
          margin-left: 0 !important;
          margin-right: 0 !important;
        }
        html, body {
          margin: 0 !important;
          padding: 0 !important;
          height: auto !important;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
        body {
          background: white;
        }
        .print-preview-shell > :not(.thermal-print-root) {
          display: none !important;
        }
        body * {
          visibility: hidden !important;
        }
        .thermal-print-root,
        .thermal-print-root * {
          visibility: visible !important;
        }
        .print-preview-shell {
          position: static !important;
          inset: auto !important;
          width: auto !important;
          height: auto !important;
          min-height: 0 !important;
          overflow: visible !important;
          padding: 0 !important;
          margin: 0 !important;
          background: transparent !important;
        }
        .thermal-print-root {
          display: block !important;
          position: static !important;
          width: var(--paper-width, 40mm) !important;
          min-height: var(--paper-height, 80mm) !important;
          margin: 0 !important;
          padding: 0 !important;
        }
        .no-print {
          display: none !important;
        }
        .print-label {
          page-break-after: always;
          break-after: page;
          page-break-inside: avoid;
          break-inside: avoid-page;
        }
        .print-label:last-child {
          page-break-after: auto;
          break-after: auto;
        }

        /* 移除浏览器默认页眉页脚 */
        @page :first {
          margin: 0 !important;
          padding-top: 0 !important;
        }
        @page :left {
          margin: 0 !important;
        }
        @page :right {
          margin: 0 !important;
        }
        
        /* 隐藏所有非打印元素 */
        header, footer, nav, aside, .no-print {
          display: none !important;
        }

        /* 隐藏标题栏和可能的页眉元素 */
        h1, h2, h3, h4, h5, h6 {
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }
      }

      .label-preview-container {
        display: flex;
        flex-wrap: wrap;
        gap: calc(var(--print-gap, 10px) * 2);
        justify-content: center;
        padding: 40px;
        background: #e2e8f0;
        --preview-font-scale: 0.7;
      }
      .label-preview-container .print-label {
        width: 40mm;
        height: 80mm;
        background: white;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        transition: all 0.2s ease;
      }
      .label-preview-container .label-content {
        width: 28mm;
        height: 60mm;
        margin: 10mm 6mm 0;
        overflow: hidden;
        font-size: calc(var(--print-font-size, 18px) * var(--preview-font-scale));
      }
      .label-header {
        text-align: center;
        font-weight: bold;
        border-bottom: 1px solid black;
        margin-bottom: 1mm;
        padding-bottom: 0.5mm;
        font-size: 14px;
      }
      .label-preview-container .label-header {
        white-space: nowrap;
        font-size: calc(14px * var(--preview-font-scale));
      }
      .label-row {
        display: flex;
        margin-bottom: 0.5mm;
        min-width: 0;
      }
      .label-row b {
        flex: 0 0 12mm;
      }
      .label-preview-container .label-row b {
        flex-basis: 9mm;
      }
      .label-row span {
        flex: 1 1 auto;
        min-width: 0;
        white-space: normal;
        overflow-wrap: anywhere;
        word-break: break-all;
      }
      .label-footer {
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        border-top: 1px dashed black;
        padding-top: 1mm;
      }
      .label-preview-container .label-footer {
        font-size: calc(12px * var(--preview-font-scale));
      }

      .fade-enter-active, .fade-leave-active {
        transition: opacity 0.2s ease;
      }
      .fade-enter-from, .fade-leave-to {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
